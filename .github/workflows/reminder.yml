name: Reminder Check

on:
  workflow_dispatch: {} # dipicu cron-job.org tiap 15 menit

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run reminder check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node reminder.js

      - name: Commit updated state
        run: |
          git config user.name "reminder-bot"
          git config user.email "reminder-bot@users.noreply.github.com"
          git add state/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update ack state [skip ci]"
          git push
